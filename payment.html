<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Friehiet Course</title>
    <link rel="stylesheet" href="assets/css/splide.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

    <section class="bg-[#f9f9f9] min-h-screen py-12 px-4 md:px-8 lg:px-16">

        <div class="container">
            <form class="mb-8">

                <div class="mb-8">
                    <div
                        class="inline-block border border-dashed border-teal-700/50 rounded-full px-4 py-1 text-xs uppercase tracking-wider font-medium mb-4 text-teal-800">
                        Compassion Coaching
                    </div>
                    <h1 class="text-primary text-[80px] font-normal leading-[110%] font-instrument">
                        SECURE <span class="text-secondary instrument-font-italic">PAYMENT</span>
                    </h1>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">

                    <div class="lg:col-span-2 space-y-10">

                        <!-- Billing -->
                        <div>
                            <h2 class="text-2xl font-serif text-teal-800 border-b border-gray-200 pb-2 mb-6">
                                Billing Information
                            </h2>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-teal-800 mb-1">Name*</label>
                                    <input type="text" required
                                        class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-teal-800 mb-1">Phone</label>
                                    <input type="tel"
                                        class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-teal-800 mb-1">Street*</label>
                                    <input type="text" required
                                        class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-teal-800 mb-1">City*</label>
                                    <input type="text" required
                                        class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-teal-800 mb-1">State*</label>
                                    <input type="text" required
                                        class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-teal-800 mb-1">Zip*</label>
                                    <input type="text" required
                                        class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                                </div>
                            </div>
                        </div>

                        <!-- Payment -->
                        <div>
                            <h2 class="text-2xl font-serif text-teal-800 border-b border-gray-200 pb-2 mb-6">
                                Payment Information
                            </h2>

                            <div class="grid grid-cols-2 gap-4 mb-6">
                                <button type="button" class="bg-teal-900 text-white font-medium py-3 rounded-lg">
                                    Credit Card
                                </button>
                                <button type="button"
                                    class="bg-transparent border border-teal-900/30 text-teal-900 font-medium py-3 rounded-lg hover:bg-white transition-colors">
                                    Check
                                </button>
                            </div>

                            <div class="space-y-4">

                                <div>
                                    <label class="block text-sm font-medium text-teal-800 mb-1">Card Number*</label>
                                    <input type="text" required placeholder="•••• •••• •••• ••••"
                                        class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                                </div>

                                <div class="grid grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-teal-800 mb-1">MM*</label>
                                        <input type="text" required maxlength="2" placeholder="MM"
                                            class="w-full bg-white border-0 rounded-lg p-3 text-center focus:ring-2 focus:ring-teal-700 outline-none">
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-teal-800 mb-1">YY*</label>
                                        <input type="text" required maxlength="2" placeholder="YY"
                                            class="w-full bg-white border-0 rounded-lg p-3 text-center focus:ring-2 focus:ring-teal-700 outline-none">
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-teal-800 mb-1">CVV*</label>
                                        <input type="password" required maxlength="4" placeholder="•••"
                                            class="w-full bg-white border-0 rounded-lg p-3 text-center focus:ring-2 focus:ring-teal-700 outline-none">
                                    </div>
                                </div>

                                <div class="w-full md:w-1/2">
                                    <label class="block text-sm font-medium text-teal-800 mb-1">Transaction Type</label>
                                    <select
                                        class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                                        <option>Sale</option>
                                        <option>Authorization</option>
                                    </select>
                                </div>

                            </div>
                        </div>

                        <!-- Registration -->
                        <div class="space-y-4">
                            <h2 class="text-2xl font-serif text-teal-800 border-b border-gray-200 pb-2 mb-6">
                                Webinar Registration
                            </h2>

                            <div>
                                <label class="block text-sm font-medium text-teal-800 mb-1">
                                    Email Address for Registration Link
                                </label>
                                <input type="email"
                                    class="w-full bg-white border-0 rounded-lg p-3 focus:ring-2 focus:ring-teal-700 outline-none">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-teal-800 mb-1">
                                    Signature
                                </label>
                                <div
                                    class="w-full bg-white border-0 rounded-lg h-40 relative focus-within:ring-2 focus-within:ring-teal-700">
                                    <canvas class="w-full h-full rounded-lg absolute inset-0"></canvas>
                                </div>
                            </div>

                            <button type="button"
                                class="bg-teal-900 text-white px-5 py-2 rounded-md text-sm font-medium hover:bg-teal-800 transition-colors">
                                Clear Signature
                            </button>
                        </div>

                    </div>

                    <!-- Summary -->
                    <div class="lg:col-span-1 lg:sticky lg:top-12">
                        <div
                            class="rounded-2xl p-6 text-white relative overflow-hidden bg-[url('assets/images/summary-card-bg.svg')] bg-cover bg-center">

                            <h3 class="text-white text-[40px] font-normal leading-[110%] font-instrument mb-6">Summary</h3>

                            <div class="space-y-4 text-sm font-light border-b border-white/10 pb-6">
                                <div class="flex justify-between">
                                    <span class="opacity-80">Sub Total</span>
                                    <span>$99.00</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="opacity-80">Electronic Transfer Fee</span>
                                    <span>$2.97</span>
                                </div>
                            </div>

                            <div class="flex justify-between items-baseline pt-6 mb-8">
                                <span class="text-base font-medium">Total</span>
                                <span class="text-2xl font-bold">$101.97</span>
                            </div>

                            <div class="w-full">
                                <a href="#"
                                    class="gsap-text-hover w-full block px-5 sm:px-8 py-3.75 rounded-xl bg-secondary text-primary text-lg font-medium hover:bg-white hover:text-secondary transition duration-300 justify-center">

                                    <span class="gsap-text-hover-inner">
                                        <span class="text">Checkout</span>
                                        <span class="text-hover">Checkout</span>
                                    </span>

                                </a>
                            </div>

                        </div>
                    </div>

                </div>

            </form>
        </div>

    </section>

    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <script src="assets/js/SplitText.min.js"></script>
    <script src="assets/js/splide.min.js"></script>
    <script src="assets/js/splide-extension-auto-scroll.min.js"></script>
    <script src="assets/js/lenis.min.js"></script>
    <script src="assets/js/script.js"></script>

</body>

</html>
