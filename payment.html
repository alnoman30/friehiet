<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Payment</title>
    <link rel="stylesheet" href="assets/css/splide.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

    <section class="bg-offwhite min-h-screen py-12 px-4 md:px-8 lg:px-16">

        <div class="container">
            <form class="mb-8">

                <div class="mb-8">
                    <div
                        class="inline-block border border-dashed border-primary/48 rounded-full px-3 py-1 text-primary text-lg font-normal leading-6 mb-4">
                        Compassion Coaching
                    </div>
                    <h1 class="text-primary text-[80px] font-normal leading-[110%] font-instrument">
                        SECURE <span class="text-secondary instrument-font-italic">PAYMENT</span>
                    </h1>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-20 items-start">

                    <div class="lg:col-span-2 space-y-10">

                        <!-- Billing -->
                        <div>
                            <h2 class="text-primary text-[40px] font-normal leading-[110%] font-instrument pb-2 mb-6">
                                Billing Information
                            </h2>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-base font-medium leading-5 text-primary mb-2">Name*</label>
                                    <input type="text" required
                                        class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                                </div>

                                <div>
                                    <label class="block text-base font-medium leading-5 text-primary mb-2">Phone</label>
                                    <input type="tel"
                                        class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                                </div>

                                <div>
                                    <label class="block text-base font-medium leading-5 text-primary mb-2">Street*</label>
                                    <input type="text" required
                                        class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                                </div>

                                <div>
                                    <label class="block text-base font-medium leading-5 text-primary mb-2">City*</label>
                                    <input type="text" required
                                        class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                                </div>

                                <div>
                                    <label class="block text-base font-medium leading-5 text-primary mb-2">State*</label>
                                    <input type="text" required
                                        class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                                </div>

                                <div>
                                    <label class="block text-base font-medium leading-5 text-primary mb-2">Zip*</label>
                                    <input type="text" required
                                        class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                                </div>
                            </div>
                        </div>

                        <!-- Payment -->
                        <div>
                            <h2 class="text-primary text-[40px] font-normal leading-[110%] font-instrument pb-2 mb-6">
                                Payment Information
                            </h2>

                            <div class="grid grid-cols-2 gap-4 mb-6">
                                <button type="button" class="bg-primary text-white text-lg font-normal leading-6 py-2.5 rounded-xl">
                                    Credit Card
                                </button>
                                <button type="button"
                                    class="text-lg font-normal leading-6 bg-transparent border border-primary text-primary py-2.5 rounded-xl hover:bg-white transition-colors">
                                    Check
                                </button>
                            </div>

                            <div class="space-y-4">

                                <div>
                                    <label class="block text-base font-medium leading-5 text-primary mb-2">Card Number*</label>
                                    <input type="text" required placeholder=""
                                        class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                                </div>

                                <div class="grid grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-base font-medium leading-5 text-primary mb-2">MM*</label>
                                        <input type="text" required maxlength="2" placeholder=""
                                            class="w-full bg-white text-primary border-0 rounded-xl p-3 text-center focus:ring-2 focus:ring-secondary/50 outline-none">
                                    </div>

                                    <div>
                                        <label class="block text-base font-medium leading-5 text-primary mb-2">YY*</label>
                                        <input type="text" required maxlength="2" placeholder=""
                                            class="w-full bg-white text-primary border-0 rounded-xl p-3 text-center focus:ring-2 focus:ring-secondary/50 outline-none">
                                    </div>

                                    <div>
                                        <label class="block text-base font-medium leading-5 text-primary mb-2">CVV*</label>
                                        <input type="password" required maxlength="4" placeholder=""
                                            class="w-full bg-white text-primary border-0 rounded-xl p-3 text-center focus:ring-2 focus:ring-secondary/50 outline-none">
                                    </div>
                                </div>

                                <div class="w-full md:w-1/2">
                                    <label class="block text-base font-medium leading-5 text-primary mb-2">Transaction Type</label>
                                    <select
                                        class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                                        <option>Sale</option>
                                        <option>Authorization</option>
                                    </select>
                                </div>

                            </div>
                        </div>

                        <!-- Registration -->
                        <div class="space-y-4">
                            <h2 class="text-primary text-[40px] font-normal leading-[110%] font-instrument pb-2 mb-6">
                                Webinar Registration
                            </h2>

                            <div>
                                <label class="block text-base font-medium leading-5 text-primary mb-2">
                                    Email Address for Registration Link
                                </label>
                                <input type="email"
                                    class="w-full bg-white text-primary border-0 rounded-xl p-3 focus:ring-2 focus:ring-secondary/50 outline-none">
                            </div>

                            <div>
                                <label class="block text-base font-medium leading-5 text-primary mb-2">
                                    Email Address for Registration Link
                                </label>

                                <textarea
                                    placeholder=""
                                    class="w-full bg-[#FBF9F8] border-4 border-white rounded-xl min-h-40 p-4 text-primary resize-none outline-none focus:ring-1 focus:ring-secondary/50"
                                ></textarea>
                            </div>

                            <button type="button"
                                class="bg-primary text-white px-6 py-2.25 rounded-lg text-lg font-medium leading-6 hover:bg-secondary hover:text-primary transition-colors">
                                Clear Signature
                            </button>
                        </div>

                    </div>

                    <!-- Summary -->
                    <div class="lg:col-span-1 lg:sticky lg:top-12">
                        <div
                            class="rounded-2xl p-6 text-white relative overflow-hidden bg-[url('../images/summary-card-bg.svg')] bg-cover bg-center">

                            <h3 class="text-white text-[40px] font-normal leading-[110%] font-instrument mb-8">Summary</h3>

                            <div class="space-y-4 text-[#BFE0E6] text-lg font-normal leading-[130%] border-b border-white/12 pb-6">
                                <div class="flex justify-between">
                                    <span class="">Sub Total</span>
                                    <span>$99.00</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="">Electronic Transfer Fee</span>
                                    <span>$2.97</span>
                                </div>
                            </div>

                            <div class="flex justify-between items-baseline pt-6 mb-8">
                                <span class="text-lg font-bold leading-[130%]">Total</span>
                                <span class="text-lg font-bold leading-[130%]">$101.97</span>
                            </div>

                            <div class="w-full">
                                <a href="#"
                                    class="gsap-text-hover w-full block px-5 sm:px-8 py-2 sm:py-3.75 rounded-xl bg-secondary text-primary text-lg font-medium  transition duration-300 justify-center">

                                    <span class="gsap-text-hover-inner">
                                        <span class="text">Checkout</span>
                                        <span class="text-hover">Checkout</span>
                                    </span>

                                </a>
                            </div>

                        </div>
                    </div>

                </div>

            </form>
        </div>

    </section>

    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <script src="assets/js/SplitText.min.js"></script>
    <script src="assets/js/splide.min.js"></script>
    <script src="assets/js/splide-extension-auto-scroll.min.js"></script>
    <script src="assets/js/lenis.min.js"></script>
    <script src="assets/js/script.js"></script>

</body>

</html>
